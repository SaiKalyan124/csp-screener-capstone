<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSP Intelligence — Interactive Flows</title><style>
:root{--navy:#071a3a;--teal:#078e88;--violet:#5145cd;--amber:#d48908;--coral:#ef5b54;--blue:#4979b9;--line:#d7e0e8}*{box-sizing:border-box}body{margin:0;background:#f9fbfc;color:var(--navy);font:13px Inter,system-ui,sans-serif;overflow:hidden}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--navy);color:white}header h1{margin:0;font-size:21px;letter-spacing:-.02em}header h1:before{content:'⌘';display:inline-grid;place-items:center;width:34px;height:34px;margin-right:12px;border:1px solid #6680a3;border-radius:6px;font-size:16px}header div{display:flex;align-items:center}header button,header output{height:36px;min-width:40px;border:1px solid #49607f;background:transparent;color:white;font-weight:700}header output{display:grid;place-items:center;width:62px;border-inline:0}header .wide{margin-left:10px;padding:0 15px;border-radius:5px}.legend{height:52px;display:flex;align-items:center;gap:23px;padding:0 70px;border-bottom:1px solid var(--line);background:#fff;text-transform:capitalize}.legend span{display:flex;align-items:center;gap:7px;font-size:11px}.legend i{width:22px;height:4px;border-radius:3px}.legend em{margin-left:auto;color:#718095;font-size:10px;font-style:normal}.workspace{position:relative;height:calc(100vh - 116px)}.viewport{position:absolute;inset:0 0 188px;overflow:auto;background-color:#fbfcfd;background-image:radial-gradient(#cbd5df .7px,transparent .7px);background-size:16px 16px}.canvas{position:relative;width:1220px;height:840px;transform-origin:0 0}.band{position:absolute;left:0;width:1220px;height:120px;padding:38px 0 0 24px;border-bottom:1px dashed #bdc9d4}.band strong,.band small{display:block;width:115px}.band strong{font-size:9px;letter-spacing:.06em}.band small{margin-top:4px;color:#6b7a90;font-size:9px}svg.edges{position:absolute;inset:0;width:1220px;height:840px}.edges path{fill:none;stroke-width:1.7;transition:.25s}.edges path.off{opacity:.12}.edges path.on{opacity:.95;stroke-width:2.4}.edges path.data,.edges path.guard{stroke-dasharray:6 5}.node{--c:var(--blue);position:absolute;width:190px;height:52px;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;padding:7px 10px;border:1.5px solid var(--c);border-radius:6px;background:white;color:var(--navy);box-shadow:0 3px 10px #071a3a12;text-align:left;cursor:pointer;transition:.22s}.node.det{--c:var(--teal)}.node.agent{--c:var(--violet)}.node.guard{--c:var(--amber)}.node.eval{--c:var(--coral)}.node.data{--c:var(--blue)}.node .icon{display:grid;place-items:center;width:27px;height:27px;color:var(--c);font-size:18px}.node strong,.node small{display:block}.node strong{font-size:10px}.node small{margin-top:3px;color:#68788e;font-size:8px}.node b{position:absolute;left:-8px;top:-9px;display:grid;place-items:center;width:19px;height:19px;border:2px solid white;border-radius:50%;background:var(--c);color:white;font-size:8px}.node.dim{opacity:.13}.node.seen{background:color-mix(in srgb,var(--c) 7%,white)}.node.current,.node.selected{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent),0 8px 19px #071a3a22}.node.current{transform:translateY(-2px)}aside{position:absolute;right:20px;top:18px;width:278px;padding:17px 9px 0;border:1px solid #d6dfe7;border-radius:11px;background:white;box-shadow:0 12px 34px #071a3a22}aside h2{margin:0 11px 14px;font-size:17px}aside>button{width:100%;min-height:45px;display:grid;grid-template-columns:14px 1fr 15px;align-items:center;gap:9px;padding:7px 10px;border:0;border-radius:6px;background:white;text-align:left;cursor:pointer}aside>button.active{background:#edf5f5}aside>button>i{width:13px;height:13px;border:1px solid #9ca9b8;border-radius:50%}aside>button.active>i{border:4px solid var(--teal)}aside strong,aside small{display:block}aside strong{font-size:11px}aside small{color:#748398;font-size:9px}aside>p{margin:8px -9px 0;padding:12px 18px;border-top:1px solid #e2e7ec;color:#5c6c82;font-size:10px;line-height:1.5}.player{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -9px;padding:10px 17px;border-top:1px solid #e2e7ec}.player button{height:31px;border:0;background:#fff;color:var(--navy);font-size:17px}.player input{grid-column:1/3;width:100%;accent-color:var(--teal)}.player small{text-align:right;align-self:center}.focus{display:flex;align-items:center;justify-content:space-between;margin:0 -9px;padding:12px 18px;border-top:1px solid #e2e7ec}.focus input{accent-color:var(--teal)}.inspector{--c:var(--teal);position:absolute;inset:auto 0 0;min-height:188px;display:grid;grid-template-columns:1.55fr .7fr .7fr .85fr 1fr;border-top:1px solid var(--line);background:white}.inspector>div{padding:22px;border-right:1px solid #e1e6eb}.inspector .lead{display:grid;grid-template-columns:48px 1fr;gap:14px}.bigicon{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--c);border-radius:7px;color:var(--c);font-size:23px}.inspector h2{margin:0;font-size:17px}.inspector mark{margin-left:7px;padding:3px 6px;border-radius:4px;background:color-mix(in srgb,var(--c) 10%,white);color:var(--c);font-size:8px;text-transform:uppercase}.inspector h3{margin:0 0 8px;font-size:9px;text-transform:uppercase;letter-spacing:.07em}.inspector p{margin:7px 0;color:#58697e;font-size:10px;line-height:1.55}.inspector code{display:block;padding:8px;border:1px solid #dce3e9;border-radius:4px;background:#f8fafb;font-size:9px;overflow-wrap:anywhere}@media(max-width:800px){.legend{padding:0 14px;overflow:auto}.legend em{display:none}.viewport{bottom:280px}.inspector{grid-template-columns:1fr 1fr;max-height:280px;overflow:auto}.inspector .lead{grid-column:1/-1}}
</style></head><body><header><h1>CSP Intelligence Architecture</h1><div><button id="minus">−</button><output id="zoom">86%</output><button id="plus">+</button><button class="wide" id="reset">Reset</button></div></header><div class="legend"><span><i style="background:var(--teal)"></i>deterministic</span><span><i style="background:var(--violet)"></i>agentic / LLM</span><span><i style="background:var(--amber)"></i>guardrail</span><span><i style="background:var(--coral)"></i>evaluation</span><span><i style="background:var(--blue)"></i>data / RAG</span><em>Solid = execution · dashed = control/data</em></div><div class="workspace"><div class="viewport"><div class="canvas" id="canvas"></div></div><aside><h2>Explore flows</h2><div id="flows"></div><p id="note"></p><div class="player"><button id="prev">◀</button><button id="play">▶</button><button id="next">▶|</button><input id="range" type="range" min="0"><small id="count"></small></div><label class="focus"><span><strong>Focus selected path</strong><small>Dim unrelated services</small></span><input id="focus" type="checkbox" checked></label></aside><div class="inspector" id="inspector"></div></div><script>
const kinds={det:'#078e88',agent:'#5145cd',guard:'#d48908',eval:'#ef5b54',data:'#4979b9'},bands=[['EXPERIENCE','Human interaction'],['ORCHESTRATION','Routing & coordination'],['DETERMINISTIC FINANCE','Rules & calculations'],['CONTEXT & RAG','Evidence engineering'],['MODEL INTELLIGENCE','Bounded synthesis'],['TRUST & QUALITY','Guardrails & evaluation'],['EXTERNAL SYSTEMS','Providers & persistence']];
const nodes=[['ui','Browser UI','Dashboard · screener · chat','det',0,190,'▣','Presents candidates, option chains, research, freshness, warnings, and citations.','User intent','Validated requests','web/app.js'],['api','HTTP API','Validation · JSON','det',0,455,'↪','Validates ticker, question, profile, and refresh requests.','HTTP request','Typed response','src/csp_screener/server.py'],['app','Application Service','Use-case coordinator','det',1,320,'◫','Coordinates screening, caching, research enrichment, and fallback behavior.','Command','Screen result','src/csp_screener/services/application.py'],['router','Intent Router','Ticker or discovery','agent',1,645,'⑂','Selects an explicit-ticker load or deterministic discovery route.','Question + profile','Bounded graph route','src/csp_screener/iteration2.py'],['quality','Market Data Quality Gate','Freshness · completeness','guard',2,135,'◇','Rejects incomplete provider state before eligibility and synthesis.','Quotes + Greeks','Reason codes','src/csp_screener/iteration2.py'],['rank','Eligibility & Ranking','Hard rules · reproducible','det',2,420,'☷','Applies liquidity, DTE, OTM, spread, bid, and delta rules. The LLM cannot override it.','Clean market data','Eligible contracts','src/csp_screener/screen.py'],['fit','Portfolio Fit & Stress','Collateral · scenarios','det',2,705,'⌁','Calculates affordability and assignment stress without model arithmetic.','Contracts + profile','Stress matrix','src/csp_screener/iteration2.py'],['yahoo','Yahoo MCP Evidence','Filings · recent news','data',3,190,'◎','Retrieves bounded company evidence with URLs and dates.','Bounded symbols','Evidence packets','src/csp_screener/providers/yahoo_mcp.py'],['context','Context Engineering','Filter · normalize · dossier','data',3,480,'▤','Builds the minimum grounded prompt context and thesis/counter-thesis dossier.','Market + evidence','Allowed context','src/csp_screener/iteration2.py'],['tavily','Tavily MCP Search','Bounded web fallback','data',3,770,'⌕','Adds recent web evidence when primary company evidence is incomplete; never ranking authority.','Scoped query','Dated web evidence','Tavily MCP · web/blueprint.html'],['llm','Structured LLM Call','Schema-bound synthesis','agent',4,480,'✦','Produces concise research language from supplied state; it does not calculate or trade.','Prompt + schema','Typed answer','src/csp_screener/iteration2.py'],['ground','Grounding Validator','Symbols · citations · format','guard',5,205,'✓','Drops symbols and citations absent from evidence and enforces structure.','Model output','Grounded answer','src/csp_screener/iteration2.py'],['veto','Independent Risk Veto','Policy · abstention','guard',5,500,'⬡','Requires fallback or abstention when risk or evidence fails.','Risk evidence','Decision codes','src/csp_screener/iteration2.py'],['eval','Evals & Arize','Quality · traces · regression','eval',5,795,'⌁','Records route, citation precision, compliance, latency, and ranking authority.','Graph state','Audit record','src/csp_screener/observability.py'],['alpaca','Alpaca','Market data','data',6,130,'↗','Supplies timestamped bars, trades, option snapshots, IV, and Greeks.','Symbols','Provider facts','src/csp_screener/providers/alpaca.py'],['supabase','Supabase','Profiles · portfolio','data',6,400,'▤','Persists user context; it is never ranking authority.','Identity','Durable context','src/csp_screener/providers/supabase.py'],['openai','OpenAI','Structured model','data',6,670,'✦','Executes one bounded structured-output synthesis call.','Messages','Typed output','LangChain ChatOpenAI'],['arize','Arize','Traces · evaluation','data',6,940,'⌁','Receives redacted telemetry for quality and regression analysis.','Safe spans','Dashboards','src/csp_screener/observability.py']];
const flows={dashboard:['Dashboard screening',['ui','api','app','quality','rank','yahoo','context','llm','ground','eval','ui'],'Research annotates the deterministic Top 10; it never overrides eligibility.'],ticker:['Ticker research',['ui','api','app','router','quality','rank','fit','yahoo','tavily','context','llm','ground','veto','eval','ui'],'Yahoo is primary evidence; Tavily is a bounded recent-web fallback.'],discovery:['Candidate discovery',['ui','api','app','router','rank','fit','yahoo','tavily','context','llm','ground','ui'],'Profile constraints shape fit only after deterministic eligibility.'],safety:['Safety & evaluation',['context','llm','ground','veto','eval'],'Post-model gates constrain symbols, citations, policy, and audit output.']};
const edges=[['ui','api','det'],['api','app','det'],['app','router','agent'],['app','quality','det'],['router','quality','agent'],['quality','rank','guard'],['rank','fit','det'],['fit','yahoo','data'],['fit','tavily','data'],['yahoo','context','data'],['tavily','context','data'],['context','llm','agent'],['llm','ground','guard'],['ground','veto','guard'],['veto','eval','eval'],['llm','eval','eval'],['alpaca','quality','data'],['supabase','fit','data'],['openai','llm','data'],['arize','eval','data'],['ground','ui','guard']];let active='ticker',step=5,playing=false,zoom=.86,selected='rank',timer;
const by=id=>nodes.find(n=>n[0]===id),canvas=document.querySelector('#canvas');bands.forEach((b,i)=>canvas.insertAdjacentHTML('beforeend',`<div class="band" style="top:${i*120}px"><strong>${b[0]}</strong><small>${b[1]}</small></div>`));let defs=Object.entries(kinds).map(([k,c])=>`<marker id="a${k}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="${c}"/></marker>`).join('');canvas.insertAdjacentHTML('beforeend',`<svg class="edges" viewBox="0 0 1220 840"><defs>${defs}</defs><g id="edgegroup"></g></svg>`);nodes.forEach((n,i)=>canvas.insertAdjacentHTML('beforeend',`<button class="node ${n[3]}" data-id="${n[0]}" style="left:${n[5]}px;top:${n[4]*120+26}px"><b>${i+1}</b><span class="icon">${n[6]}</span><span><strong>${n[1]}</strong><small>${n[2]}</small></span></button>`));
function render(){let f=flows[active],seen=new Set(f[1].slice(0,step+1));document.querySelector('#edgegroup').innerHTML=edges.map(e=>{let a=by(e[0]),b=by(e[1]),x=a[5]+95,y=a[4]*120+75,X=b[5]+95,Y=b[4]*120+29,m=(y+Y)/2,on=seen.has(e[0])&&seen.has(e[1]);return`<path d="M${x} ${y}C${x} ${m} ${X} ${m} ${X} ${Y}" stroke="${kinds[e[2]]}" marker-end="url(#a${e[2]})" class="${e[2]} ${on?'on':'off'}"/>`}).join('');document.querySelectorAll('.node').forEach(el=>{let id=el.dataset.id;el.classList.toggle('dim',document.querySelector('#focus').checked&&!f[1].includes(id));el.classList.toggle('seen',seen.has(id));el.classList.toggle('current',f[1][step]===id);el.classList.toggle('selected',id===selected)});document.querySelector('#note').textContent=f[2];document.querySelector('#range').max=f[1].length-1;document.querySelector('#range').value=step;document.querySelector('#count').textContent=`Step ${step+1}/${f[1].length}`;let n=by(selected),label={det:'deterministic',agent:'non-deterministic',guard:'guardrail',eval:'evaluation',data:'data / RAG'}[n[3]];document.querySelector('#inspector').style.setProperty('--c',kinds[n[3]]);document.querySelector('#inspector').innerHTML=`<div class="lead"><span class="bigicon">${n[6]}</span><span><h2>${n[1]} <mark>${label}</mark></h2><p>${n[7]}</p></span></div><div><h3>Inputs</h3><p>${n[8]}</p></div><div><h3>Outputs</h3><p>${n[9]}</p></div><div><h3>Trust boundary</h3><p>${n[3]==='agent'?'Non-deterministic, schema bounded':'Deterministic or read-only boundary'}</p></div><div><h3>Source</h3><code>${n[10]}</code></div>`}
document.querySelector('#flows').innerHTML=Object.entries(flows).map(([k,v])=>`<button data-flow="${k}"><i></i><span><strong>${v[0]}</strong><small>${v[1].length} steps</small></span><b>›</b></button>`).join('');document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{active=b.dataset.flow;step=0;playing=false;document.querySelectorAll('[data-flow]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('[data-flow="ticker"]').classList.add('active');document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});document.querySelector('#prev').onclick=()=>{step=Math.max(0,step-1);render()};document.querySelector('#next').onclick=()=>{step=Math.min(flows[active][1].length-1,step+1);render()};document.querySelector('#play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'Ⅱ':'▶';clearInterval(timer);if(playing)timer=setInterval(()=>{step=step>=flows[active][1].length-1?0:step+1;render()},800)};document.querySelector('#range').oninput=e=>{step=+e.target.value;render()};document.querySelector('#focus').onchange=render;function setzoom(v){zoom=Math.max(.55,Math.min(1.2,v));canvas.style.transform=`scale(${zoom})`;document.querySelector('#zoom').textContent=Math.round(zoom*100)+'%'}document.querySelector('#minus').onclick=()=>setzoom(zoom-.1);document.querySelector('#plus').onclick=()=>setzoom(zoom+.1);document.querySelector('#reset').onclick=()=>setzoom(.86);setzoom(zoom);render();
</script></body></html>
